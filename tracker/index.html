<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Ngannou Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111113;
  --card: #1c1c1e;
  --card2: #242426;
  --border: #2c2c2e;
  --text: #f2f2f7;
  --sub: #8e8e93;
  --gold: #d4a017;
  --gold-dim: #a07a10;
  --green: #30d158;
  --red: #ff453a;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --navy: #1d4ed8;
  --slate: #64748b;
  --tab-h: 60px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; height: 100dvh; }
body {
  height: 100%; height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  font-size: 16px;
}

/* ─── APP SHELL ─── */
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.screen { display: none; }
.screen.active { display: block; }

/* ─── TAB BAR ─── */
#tabbar {
  flex-shrink: 0;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--sub);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 0;
  transition: color 0.15s;
  position: relative;
}
.tab svg { width: 22px; height: 22px; stroke-width: 1.8; }
.tab.active { color: var(--gold); }
.tab-dot {
  position: absolute;
  top: 6px;
  right: calc(50% - 14px);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  display: none;
}
.tab-dot.show { display: block; }

/* ─── PAGE COMMON ─── */
.pg { padding: 16px 16px calc(16px); }
.pg-top {
  padding-top: max(16px, env(safe-area-inset-top, 16px));
}
.pg h2 { font-size: 22px; font-weight: 700; margin-bottom: 16px; }

/* ─── CARD ─── */
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}
.card-sm { padding: 12px 14px; border-radius: 12px; }
.card-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--sub);
  margin-bottom: 6px;
}
.card-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ─── BUTTONS ─── */
.btn {
  display: block;
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  text-align: center;
}
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-gold { background: var(--gold); color: #000; }
.btn-ghost { background: var(--card2); color: var(--text); }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 9px 16px; font-size: 14px; border-radius: 10px; width: auto; display: inline-block; }
.btn-xs { padding: 6px 12px; font-size: 13px; border-radius: 8px; width: auto; display: inline-block; }

/* ─── PHASE CHIP ─── */
.chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ─── PROGRESS BAR ─── */
.pbar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.pbar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

/* ─── HOME SCREEN ─── */
.home-header {
  padding: max(56px, env(safe-area-inset-top, 56px)) 16px 0;
  margin-bottom: 4px;
}
.home-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 2px;
}
.home-week-label {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.home-sub {
  font-size: 13px;
  color: var(--sub);
  margin-top: 2px;
}
.next-session-card {
  background: var(--card);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.nsc-phase-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.nsc-day-label {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.nsc-block-info {
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 14px;
  line-height: 1.5;
}
.exercise-preview {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
}
.exercise-preview-name { font-size: 14px; flex: 1; }
.exercise-preview-target { font-size: 13px; color: var(--sub); }

/* ─── WORKOUT SCREEN ─── */
.workout-header {
  padding: max(52px, env(safe-area-inset-top, 52px)) 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.wh-title { font-size: 18px; font-weight: 700; }
.wh-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }

/* Exercise block */
.ex-block {
  margin: 12px 16px 0;
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
}
.ex-block.divider-block {
  background: none;
  border-radius: 0;
  margin: 4px 16px 0;
}
.ex-divider-label {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  padding: 6px;
  border: 1px solid var(--amber);
  border-radius: 8px;
  opacity: 0.8;
}
.ex-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
}
.ex-check {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
}
.ex-check.done { background: var(--green); border-color: var(--green); }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-size: 16px; font-weight: 600; }
.ex-target { font-size: 12px; color: var(--sub); margin-top: 1px; }
.ex-note { font-size: 11px; color: var(--gold-dim); margin-top: 2px; font-style: italic; }
.ex-sets { padding: 0 16px 14px; }

/* Set row */
.set-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
}
.set-num {
  font-size: 12px;
  color: var(--sub);
  width: 36px;
  flex-shrink: 0;
  font-weight: 600;
}
.set-weight-wrap, .set-reps-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
}
.set-stepper {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--card2);
  border: none;
  color: var(--text);
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.set-stepper:active { opacity: 0.6; }
.set-val {
  min-width: 44px;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  padding: 0 2px;
}
.set-val.type-text {
  font-size: 14px;
  font-weight: 600;
  min-width: 36px;
}
.set-x { font-size: 13px; color: var(--sub); margin: 0 2px; }
.set-done {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--card2);
  border: none;
  color: var(--sub);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: auto;
  transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.set-done.done { background: var(--green); color: #000; }
.prev-label { font-size: 11px; color: var(--sub); opacity: 0.6; margin-left: 4px; }

/* Inline edit input */
.val-input {
  background: var(--border);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  width: 60px;
  text-align: center;
  padding: 2px 4px;
  outline: none;
}

/* Week note callout */
.week-note {
  margin: 12px 16px 0;
  background: rgba(212,160,23,0.12);
  border: 1px solid rgba(212,160,23,0.3);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--gold);
  line-height: 1.5;
}
.week-note strong { font-weight: 700; }

.workout-footer { padding: 20px 16px 24px; }

/* ─── REST TIMER ─── */
#rest-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  display: none;
}
#rest-overlay.show { display: flex; }
.rest-label { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sub); }
.rest-count { font-size: 88px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); letter-spacing: -4px; line-height: 1; }
.rest-exercise { font-size: 14px; color: var(--sub); text-align: center; max-width: 220px; }
.rest-skip { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }

/* ─── HISTORY SCREEN ─── */
.hist-item {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.hist-item:active { opacity: 0.7; }
.hi-left { flex: 1; min-width: 0; }
.hi-date { font-size: 12px; color: var(--sub); margin-bottom: 2px; }
.hi-name { font-size: 15px; font-weight: 600; }
.hi-detail { font-size: 12px; color: var(--sub); margin-top: 2px; }
.hi-right { font-size: 22px; color: var(--sub); }
.hist-detail-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  overflow-y: auto;
  display: none;
}
.hist-detail-overlay.show { display: block; }
.hdo-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: max(52px, env(safe-area-inset-top, 52px)) 16px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
}
.hdo-back { background: none; border: none; color: var(--gold); font-size: 16px; cursor: pointer; padding: 4px; }

/* ─── PROGRESS SCREEN ─── */
.lift-card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 10px;
}
.lift-name { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.lift-max { font-size: 36px; font-weight: 800; color: var(--gold); line-height: 1; }
.lift-max-unit { font-size: 16px; font-weight: 500; color: var(--sub); margin-left: 4px; }
.lift-recent { font-size: 12px; color: var(--sub); margin-top: 4px; }
.lift-bar-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.lift-bar-label { font-size: 11px; color: var(--sub); width: 36px; text-align: right; flex-shrink: 0; }
.lift-bar-fill {
  height: 6px;
  border-radius: 3px;
  background: var(--gold);
  min-width: 4px;
  transition: width 0.4s;
}
.lift-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }

/* Bodyweight tracker */
.bw-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
}
.bw-date { font-size: 12px; color: var(--sub); width: 90px; }
.bw-val { font-size: 16px; font-weight: 700; }
.bw-delta { font-size: 12px; margin-left: 4px; }

/* ─── SETTINGS / SETUP ─── */
#setup-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 300;
  padding: max(60px, env(safe-area-inset-top, 60px)) 24px 40px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
#setup-overlay.hidden { display: none; }
.setup-title { font-size: 36px; font-weight: 900; color: var(--gold); line-height: 1; margin-bottom: 8px; }
.setup-sub { font-size: 14px; color: var(--sub); line-height: 1.6; margin-bottom: 32px; }
.inp-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; }
.inp {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  margin-bottom: 20px;
  -webkit-appearance: none;
}
.inp:focus { border-color: var(--gold); }
select.inp { cursor: pointer; }
.setup-spacer { flex: 1; }

/* ─── TOAST ─── */
#toast {
  position: fixed;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ─── UTILS ─── */
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8 { gap: 8px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-0 { margin-bottom: 0; }
.text-sub { color: var(--sub); font-size: 13px; }
.text-gold { color: var(--gold); }
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.bold { font-weight: 700; }
.empty-state { text-align: center; padding: 60px 24px; color: var(--sub); }
.empty-state svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px; }

/* ─── MODAL SHEET ─── */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 500;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
#modal-overlay.show { display: flex; }
#modal-sheet {
  background: var(--surface);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 80dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--sub); line-height: 1.5; margin-bottom: 14px; }
.modal-textarea {
  width: 100%;
  min-height: 140px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 12px;
  padding: 10px;
  font-family: ui-monospace, monospace;
  outline: none;
}

/* ─── EXERCISE SWAP ─── */
.swap-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--card2);
  border: none;
  color: var(--sub);
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.swap-btn:active { opacity: 0.6; }
.sub-opt {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
  cursor: pointer;
}
.sub-opt:active { border-color: var(--gold); }
.sub-remember {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 0 14px;
  font-size: 14px;
  color: var(--text);
}
.sub-remember input { width: 20px; height: 20px; accent-color: var(--gold); }
</style>
</head>
<body>

<!-- ─── SETUP OVERLAY ─── -->
<div id="setup-overlay">
  <div class="setup-title">Ngannou<br>Tracker</div>
  <div class="setup-sub">37-week program to build elite strength, size, and conditioning. Set your preferences to get started.</div>
  <label class="inp-label" for="unit-sel">Weight Unit</label>
  <select class="inp" id="unit-sel">
    <option value="lbs">lbs (pounds)</option>
    <option value="kg">kg (kilograms)</option>
  </select>
  <label class="inp-label" for="bw-inp">Your Current Bodyweight</label>
  <input class="inp" type="number" id="bw-inp" placeholder="e.g. 185" inputmode="decimal" step="0.1">
  <div id="settings-extra" style="display:none">
    <button class="btn btn-ghost" onclick="exportData()">Export Backup</button>
    <button class="btn btn-ghost mt-8" onclick="importData()">Import Backup</button>
  </div>
  <div class="setup-spacer"></div>
  <button class="btn btn-gold" id="setup-btn" onclick="completeSetup()">Start Program →</button>
  <button class="btn btn-ghost mt-8" id="setup-close" style="display:none" onclick="closeSettings()">Close</button>
</div>

<!-- ─── REST TIMER OVERLAY ─── -->
<div id="rest-overlay">
  <div class="rest-label">Rest</div>
  <div class="rest-count" id="rest-count">90</div>
  <div class="rest-exercise" id="rest-exercise"></div>
  <button class="rest-skip" onclick="skipRest()">Skip Rest</button>
</div>

<!-- ─── TOAST ─── -->
<div id="toast"></div>

<!-- ─── HISTORY DETAIL OVERLAY ─── -->
<div id="hist-detail-overlay" class="hist-detail-overlay">
  <div class="hdo-header">
    <button class="hdo-back" onclick="closeHistDetail()">← Back</button>
    <div>
      <div style="font-size:16px;font-weight:700" id="hdo-title"></div>
      <div style="font-size:12px;color:var(--sub)" id="hdo-sub"></div>
    </div>
  </div>
  <div id="hdo-body" style="padding:16px"></div>
</div>

<!-- ─── MODAL SHEET ─── -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-sheet"></div>
</div>

<!-- ─── MAIN APP ─── -->
<div id="app">
  <main id="content">

    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="home-header">
        <div class="home-brand">Ngannou Program</div>
        <div class="home-week-label" id="home-week-label">Week 1 of 37</div>
        <div class="home-sub" id="home-phase-label">Phase 1 · Structural Strength</div>
      </div>
      <div class="pg" style="padding-top:12px" id="home-content"></div>
    </div>

    <!-- WORKOUT (active session) -->
    <div id="screen-workout" class="screen">
      <div class="workout-header">
        <div class="wh-title" id="wh-title">Today's Workout</div>
        <div class="wh-sub" id="wh-sub"></div>
      </div>
      <div id="workout-body"></div>
      <div class="workout-footer">
        <button class="btn btn-gold" id="finish-btn" onclick="finishWorkout()">Finish &amp; Save Workout</button>
        <button class="btn btn-ghost mt-8" onclick="abandonWorkout()">Discard Workout</button>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="screen-history" class="screen">
      <div style="padding: max(52px,env(safe-area-inset-top,52px)) 16px 8px">
        <h2>History</h2>
      </div>
      <div class="pg" style="padding-top:0" id="history-content"></div>
    </div>

// SESSION LIST — pre-compute flat array of all training sessions
// ═══════════════════════════════════════════════════════════════════

function buildSessions() {
  const sessions = [];
  let globalWeek = 0;

  for (const phase of PHASES) {
    for (let pw = 1; pw <= phase.totalWeeks; pw++) {
      globalWeek++;
      const block = phase.blocks.find(b => b.phaseWeeks.includes(pw));
      const isDeload = block?.isDeload || false;

      let dayIndices;
      if (isDeload && phase.deloadDayIndices) {
        dayIndices = phase.deloadDayIndices;
      } else {
        dayIndices = Array.from({ length: phase.daysPerWeek }, (_, i) => i);
      }

      for (const di of dayIndices) {
        const day = phase.days[di];
        sessions.push({
          idx: sessions.length,
          phaseId: phase.id,
          phaseName: phase.name,
          phaseColor: phase.color,
          phaseWeek: pw,
          globalWeek,
          block,
          isDeload,
          dayLabel: day.label,
          dayColor: day.color,
          isPower: day.isPower || false,
          isConditioning: day.isConditioning || false,
          exercises: day.exercises,
          dayIndex: di
        });
      }
    }
  }
  return sessions;
}

// STATE & STORAGE
// ═══════════════════════════════════════════════════════════════════

function getState() {
  try { return JSON.parse(localStorage.getItem('ng_state') || 'null'); } catch { return null; }
}
function saveState(s) {
  try { localStorage.setItem('ng_state', JSON.stringify(s)); }
  catch { showToast('⚠️ Could not save — storage blocked or full'); }
}

function getLogs() {
  try { return JSON.parse(localStorage.getItem('ng_logs') || '{}'); } catch { return {}; }
}
function saveLogs(l) {
  try { localStorage.setItem('ng_logs', JSON.stringify(l)); }
  catch { showToast('⚠️ Could not save — storage blocked or full'); }
}

// Active workout lives in localStorage so it survives the app being
// killed in the background mid-session (sessionStorage does not).
function getActiveWorkout() {
  try { return JSON.parse(localStorage.getItem('ng_active') || 'null'); } catch { return null; }
}
function saveActiveWorkout(w) {
  try {
    if (w) localStorage.setItem('ng_active', JSON.stringify(w));
    else localStorage.removeItem('ng_active');
  } catch { showToast('⚠️ Could not save — storage blocked or full'); }
}

// Get last logged weights for an exercise by name
function getLastWeights(exerciseName) {
  const logs = getLogs();
  const entries = Object.values(logs).filter(l => l.exercises);
  entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  for (const log of entries) {
    const ex = log.exercises.find(e => e.name === exerciseName);
    if (ex && ex.sets && ex.sets.length > 0) {
      return ex.sets.map(s => s.weight || 0);
    }
  }
  return null;
}

// Max logged weight for an exercise
function getMaxWeight(exerciseName) {
  const logs = getLogs();
  let max = 0;
  let maxDate = null;
  for (const log of Object.values(logs)) {
    if (!log.exercises) continue;
    const ex = log.exercises.find(e => e.name === exerciseName);
    if (!ex) continue;
    for (const s of (ex.sets || [])) {
      if (s.done && (s.weight || 0) > max) { max = s.weight; maxDate = log.date; }
    }
  }
  return { max, date: maxDate };
}

function completeSetup() {
  const unit = document.getElementById('unit-sel').value;
  const bw = parseFloat(document.getElementById('bw-inp').value) || 0;
  // Merge into existing state — never reset program position or subs
  const prev = getState() || {};
  const state = { ...prev, unit, initialized: true, nextSession: prev.nextSession || 0 };
  saveState(state);

  if (bw > 0) {
    const logs = getLogs();
    if (!logs._bodyweight) logs._bodyweight = [];
    logs._bodyweight.push({ date: new Date().toISOString().slice(0,10), weight: bw });
    saveLogs(logs);
  }

  document.getElementById('setup-overlay').classList.add('hidden');
  showTab(currentTab);
}

function openSettings() {
  const state = getState();
  document.getElementById('unit-sel').value = state.unit || 'lbs';
  document.getElementById('bw-inp').value = '';
  const ov = document.getElementById('setup-overlay');
  ov.classList.remove('hidden');
  ov.querySelector('.setup-title').textContent = 'Settings';
  ov.querySelector('.setup-sub').textContent =
    'Update your preferences, or back up your data. Your program position and workout history are never affected. Leave bodyweight blank to keep it unchanged.';
  document.getElementById('settings-extra').style.display = 'block';
  document.getElementById('setup-btn').textContent = 'Save Settings';
  document.getElementById('setup-close').style.display = 'block';
}

function closeSettings() {
  document.getElementById('setup-overlay').classList.add('hidden');
}

// ─── Backup / Restore ───
function exportData() {
  const payload = JSON.stringify({ state: getState(), logs: getLogs(), exportedAt: new Date().toISOString() });
  openModal(`
    <div class="modal-title">Export Backup</div>
    <div class="modal-sub">Copy this text and save it somewhere safe — Notes, or email it to yourself. To restore on any phone, open Settings → Import Backup and paste it.</div>
    <textarea class="modal-textarea" id="export-ta" readonly>${payload.replace(/</g, '&lt;')}</textarea>
    <button class="btn btn-gold mt-12" onclick="copyExport()">Copy to Clipboard</button>
    <button class="btn btn-ghost mt-8" onclick="closeModal()">Done</button>
  `);
}
function copyExport() {
  const ta = document.getElementById('export-ta');
  ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  const fallback = () => { try { document.execCommand('copy'); showToast('Copied'); } catch { showToast('Select the text and copy manually'); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(() => showToast('Copied')).catch(fallback);
  } else fallback();
}
function importData() {
  openModal(`
    <div class="modal-title">Import Backup</div>
    <div class="modal-sub">Paste a backup you exported earlier. This replaces the data currently on this phone.</div>
    <textarea class="modal-textarea" id="import-ta" placeholder="Paste backup text here"></textarea>
    <button class="btn btn-gold mt-12" onclick="doImport()">Restore Backup</button>
    <button class="btn btn-ghost mt-8" onclick="closeModal()">Cancel</button>
  `);
}
function doImport() {
  try {
    const data = JSON.parse(document.getElementById('import-ta').value);
    if (!data.state || !data.logs) throw new Error('bad');
    saveState(data.state);
    saveLogs(data.logs);
    closeModal();
    closeSettings();
    showToast('Backup restored ✓');
    showTab('home');
  } catch {
    showToast('That doesn\'t look like a valid backup');
  }
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════

let currentTab = 'home';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById('screen-' + tab);
  if (screen) screen.classList.add('active');

  if (tab === 'home') renderHome();
  else if (tab === 'workout') renderWorkout();
  else if (tab === 'history') renderHistory();
  else if (tab === 'progress') renderProgress();
}

// ═══════════════════════════════════════════════════════════════════
// HOME SCREEN
// ═══════════════════════════════════════════════════════════════════

function renderHome() {
  const state = getState();
  if (!state) return;

  const nextIdx = state.nextSession || 0;
  const session = SESSIONS[nextIdx];

  const weekLabel = document.getElementById('home-week-label');
  const phaseLabel = document.getElementById('home-phase-label');

  if (!session) {
    weekLabel.textContent = 'Program Complete!';
    phaseLabel.textContent = '37 weeks done 🏆';
    document.getElementById('home-content').innerHTML =
      '<div class="empty-state"><div style="font-size:48px;margin-bottom:16px">🏆</div>' +
      '<div style="font-size:18px;font-weight:700;color:var(--gold);margin-bottom:8px">Program Complete</div>' +
      '<div class="text-sub">You completed the full 37-week Ngannou program. Check your Progress tab.</div></div>';
    return;
  }

  weekLabel.textContent = `Week ${session.globalWeek} of ${TOTAL_WEEKS}`;
  phaseLabel.textContent = `Phase ${session.phaseId} · ${session.phaseName}`;

  const totalSessions = SESSIONS.length;
  const pct = Math.round((nextIdx / totalSessions) * 100);

  const active = getActiveWorkout();
  const inProgress = active && active.sessionIdx === nextIdx;

  const exPreviews = session.exercises
    .filter(e => e.name !== '__DIVIDER__')
    .slice(0, 4)
    .map(e => {
      const reps = typeof e.reps === 'number' ? `${e.sets}×${e.reps}` : `${e.sets}×`;
      return `<div class="exercise-preview">
        <span class="exercise-preview-name">${e.name}</span>
        <span class="exercise-preview-target">${reps}</span>
      </div>`;
    }).join('');

  const moreCount = session.exercises.filter(e => e.name !== '__DIVIDER__').length - 4;

  const chipBg = session.isDeload ? '#16a34a' : (session.isPower ? '#d97706' : session.phaseColor);

  document.getElementById('home-content').innerHTML = `
    <div class="card" style="background:var(--surface);border:1px solid var(--border);margin-bottom:16px">
      <div class="flex justify-between items-center mb-0">
        <div class="text-sub">Overall progress</div>
        <div class="text-gold bold">${pct}%</div>
      </div>
      <div class="pbar-wrap"><div class="pbar" style="width:${pct}%;background:var(--gold)"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <div class="text-sub" style="font-size:11px">Session ${nextIdx + 1} of ${totalSessions}</div>
        <div class="text-sub" style="font-size:11px">Ph${session.phaseId} Wk${session.phaseWeek}</div>
      </div>
    </div>

    <div class="next-session-card">
      <div class="nsc-phase-row">
        <span class="chip" style="background:${chipBg}22;color:${chipBg}">
          ${session.block?.name || 'Training'}
        </span>
        <span class="text-sub">${session.block?.intensity || ''}</span>
      </div>
      <div class="nsc-day-label">${session.dayLabel}</div>
      <div class="nsc-block-info">${session.block?.note || ''}</div>
      ${exPreviews}
      ${moreCount > 0 ? `<div class="text-sub mt-4" style="font-size:12px">+${moreCount} more exercises</div>` : ''}
      <button class="btn btn-gold mt-12" onclick="startWorkout(${nextIdx})">
        ${inProgress ? 'Continue Workout →' : 'Start Workout →'}
      </button>
    </div>

    ${nextIdx > 0 ? `<button class="btn btn-ghost" onclick="showTab('history')">View History</button>` : ''}
  `;
}

// ═══════════════════════════════════════════════════════════════════
// WORKOUT SCREEN
// ═══════════════════════════════════════════════════════════════════

let activeWorkout = null; // in-memory mirror of sessionStorage

function startWorkout(sessionIdx) {
  const session = SESSIONS[sessionIdx];
  const existing = getActiveWorkout();

  if (existing && existing.sessionIdx === sessionIdx) {
    activeWorkout = existing;
  } else {
    // Build fresh workout log structure, applying remembered substitutions
    const subMap = (getState() || {}).subs || {};
    const exercises = session.exercises.map(e => {
      if (e.name === '__DIVIDER__') return { divider: true };
      const name = subMap[e.name] || e.name;
      const prevWeights = getLastWeights(name);
      const numSets = e.sets || 3;
      const repsDefault = typeof e.reps === 'number' ? e.reps : 0;
      const sets = Array.from({ length: numSets }, (_, i) => ({
        weight: prevWeights ? (prevWeights[i] || prevWeights[0] || 0) : 0,
        reps: repsDefault,
        done: false
      }));
      const ex = { name, unit: e.unit, type: e.type || 'weight', repsLabel: e.reps, sets };
      if (name !== e.name) ex.origName = e.name;
      return ex;
    });
    activeWorkout = { sessionIdx, startedAt: Date.now(), exercises };
    saveActiveWorkout(activeWorkout);
  }

  showTab('workout');
  renderWorkout();
}

function renderWorkout() {
  const active = activeWorkout || getActiveWorkout();
  if (!active) {
    const state = getState();
    const nextIdx = state ? (state.nextSession || 0) : 0;
    document.getElementById('wh-title').textContent = 'No Active Workout';
    document.getElementById('wh-sub').textContent = '';
    document.getElementById('workout-body').innerHTML =
      `<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">💪</div>
       <div class="text-sub">Go to Home to start today's session</div>
       <button class="btn btn-gold btn-sm mt-12" onclick="showTab('home')">Go to Home</button></div>`;
    document.getElementById('finish-btn').textContent = 'Finish & Save Workout';
    document.getElementById('workout-dot').classList.remove('show');
    return;
  }

  activeWorkout = active;
  document.getElementById('workout-dot').classList.add('show');

  const session = SESSIONS[active.sessionIdx];
  document.getElementById('wh-title').textContent = session.dayLabel;
  document.getElementById('wh-sub').textContent =
    `Phase ${session.phaseId} · Week ${session.phaseWeek} · ${session.block?.name || ''}`;

  const state = getState();
  const unit = state?.unit || 'lbs';

  let html = '';

  // Week note callout
  if (session.block?.note) {
    html += `<div class="week-note"><strong>${session.block.name} (${session.block.intensity}):</strong> ${session.block.note}</div>`;
  }

  active.exercises.forEach((ex, ei) => {
    if (ex.divider) {
      html += `<div class="ex-block divider-block"><div class="ex-divider-label">⚡ Power Block</div></div>`;
      return;
    }

    const srcEx = session.exercises.find(e => e.name === (ex.origName || ex.name)) || {};
    const allDone = ex.sets.every(s => s.done);

    html += `<div class="ex-block" id="ex-${ei}">
      <div class="ex-header">
        <div class="ex-check ${allDone ? 'done' : ''}">
          ${allDone ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
        </div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.sets.length} sets × ${ex.repsLabel || ex.sets[0]?.reps || ''} ${ex.unit !== 'lbs' ? ex.unit : unit}</div>
          ${ex.origName ? `<div class="ex-note" style="color:var(--blue)">⇄ Substitute for ${ex.origName}</div>` : ''}
          ${srcEx.note ? `<div class="ex-note">${srcEx.note}</div>` : ''}
          ${srcEx.bNote ? `<div class="ex-note">${srcEx.bNote}</div>` : ''}
        </div>
        <button class="swap-btn" onclick="openSubPicker(${ei})" aria-label="Swap exercise">⇄</button>
      </div>
      <div class="ex-sets" id="ex-sets-${ei}">
        ${ex.sets.map((s, si) => renderSetRow(ei, si, s, ex, unit)).join('')}
      </div>
    </div>`;
  });

  document.getElementById('workout-body').innerHTML = html;

  const total = active.exercises.filter(e => !e.divider).length;
  const done = active.exercises.filter(e => !e.divider && e.sets.every(s => s.done)).length;
  document.getElementById('finish-btn').textContent =
    done === total ? `✓ Finish & Save Workout (${done}/${total})` : `Finish & Save Workout (${done}/${total} done)`;
}

function renderSetRow(ei, si, s, ex, unit) {
  const isTimed = ex.type === 'timed';
  const isDist = ex.type === 'dist';
  const isBw = ex.unit === 'bw';

  let weightHtml;
  if (isBw) {
    weightHtml = `<span class="set-val" style="color:var(--sub)">BW</span>`;
  } else if (isTimed || isDist) {
    weightHtml = `<span class="set-val type-text">${ex.repsLabel || s.reps}</span>`;
  } else {
    weightHtml = `
      <button class="set-stepper" onclick="adjustWeight(${ei},${si},-2.5)">−</button>
      <span class="set-val" id="w-${ei}-${si}" onclick="editVal(${ei},${si},'weight')">${s.weight || 0}</span>
      <button class="set-stepper" onclick="adjustWeight(${ei},${si},2.5)">+</button>
      <span style="font-size:11px;color:var(--sub)">${unit}</span>
    `;
  }

  let repsHtml;
  if (isTimed || isDist || isBw) {
    repsHtml = '';
  } else {
    repsHtml = `
      <span class="set-x">×</span>
      <button class="set-stepper" onclick="adjustReps(${ei},${si},-1)">−</button>
      <span class="set-val" id="r-${ei}-${si}" onclick="editVal(${ei},${si},'reps')">${s.reps}</span>
      <button class="set-stepper" onclick="adjustReps(${ei},${si},1)">+</button>
      <span style="font-size:11px;color:var(--sub)">reps</span>
    `;
  }

  return `<div class="set-row" id="set-row-${ei}-${si}">
    <span class="set-num">Set ${si + 1}</span>
    <div class="set-weight-wrap">${weightHtml}</div>
    ${repsHtml}
    <button class="set-done ${s.done ? 'done' : ''}" id="sd-${ei}-${si}" onclick="toggleSet(${ei},${si})">
      ${s.done
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
      }
    </button>
  </div>`;
}

function adjustWeight(ei, si, delta) {
  if (!activeWorkout) return;
  const s = activeWorkout.exercises[ei].sets[si];
  s.weight = Math.max(0, Math.round((s.weight + delta) * 10) / 10);
  const el = document.getElementById(`w-${ei}-${si}`);
  if (el) el.textContent = s.weight;
  saveActiveWorkout(activeWorkout);
}

function adjustReps(ei, si, delta) {
  if (!activeWorkout) return;
  const s = activeWorkout.exercises[ei].sets[si];
  s.reps = Math.max(0, (s.reps || 0) + delta);
  const el = document.getElementById(`r-${ei}-${si}`);
  if (el) el.textContent = s.reps;
  saveActiveWorkout(activeWorkout);
}

function editVal(ei, si, field) {
  const id = field === 'weight' ? `w-${ei}-${si}` : `r-${ei}-${si}`;
  const el = document.getElementById(id);
  if (!el) return;
  const cur = el.textContent;
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.className = 'val-input';
  inp.value = cur;
  inp.inputMode = 'decimal';
  inp.step = field === 'weight' ? '2.5' : '1';
  el.replaceWith(inp);
  inp.focus();
  inp.select();
  const commit = () => {
    const val = parseFloat(inp.value) || 0;
    if (activeWorkout) {
      activeWorkout.exercises[ei].sets[si][field] = val;
      saveActiveWorkout(activeWorkout);
    }
    const span = document.createElement('span');
    span.className = 'set-val';
    span.id = id;
    span.textContent = val;
    span.onclick = () => editVal(ei, si, field);
    inp.replaceWith(span);
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
}

function toggleSet(ei, si) {
  if (!activeWorkout) return;
  const s = activeWorkout.exercises[ei].sets[si];
  s.done = !s.done;
  saveActiveWorkout(activeWorkout);

  const btn = document.getElementById(`sd-${ei}-${si}`);
  if (btn) {
    btn.classList.toggle('done', s.done);
    btn.innerHTML = s.done
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
  }

  // Update exercise header check
  const allDone = activeWorkout.exercises[ei].sets.every(s => s.done);
  const checkEl = document.querySelector(`#ex-${ei} .ex-check`);
  if (checkEl) {
    checkEl.classList.toggle('done', allDone);
    checkEl.innerHTML = allDone
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
      : '';
  }

  // Update finish button
  const state = getState();
  const unit = state?.unit || 'lbs';
  const total = activeWorkout.exercises.filter(e => !e.divider).length;
  const done = activeWorkout.exercises.filter(e => !e.divider && e.sets.every(s => s.done)).length;
  document.getElementById('finish-btn').textContent =
    done === total ? `✓ Finish & Save Workout (${done}/${total})` : `Finish & Save Workout (${done}/${total} done)`;

  // Start rest timer if set was just completed
  if (s.done) {
    const session = SESSIONS[activeWorkout.sessionIdx];
    const restSeconds = session.isConditioning ? 45 : (session.isDeload ? 90 : 120);
    const exName = activeWorkout.exercises[ei].name;
    startRestTimer(restSeconds, exName, ei, si);
  }
}

function finishWorkout() {
  if (!activeWorkout) return;
  const session = SESSIONS[activeWorkout.sessionIdx];
  const logs = getLogs();
  const logKey = activeWorkout.sessionIdx;

  logs[logKey] = {
    sessionIdx: activeWorkout.sessionIdx,
    phaseId: session.phaseId,
    phaseWeek: session.phaseWeek,
    globalWeek: session.globalWeek,
    dayLabel: session.dayLabel,
    date: new Date().toISOString().slice(0, 10),
    ts: Date.now(),
    duration: Math.round((Date.now() - activeWorkout.startedAt) / 60000),
    exercises: activeWorkout.exercises.filter(e => !e.divider)
  };

  saveLogs(logs);

  const state = getState();
  state.nextSession = Math.max(state.nextSession || 0, activeWorkout.sessionIdx + 1);
  saveState(state);

  saveActiveWorkout(null);
  activeWorkout = null;

  document.getElementById('workout-dot').classList.remove('show');
  showToast('Workout saved! 💪');
  showTab('home');
}

function abandonWorkout() {
  openModal(`
    <div class="modal-title">Discard this workout?</div>
    <div class="modal-sub">The sets you've logged today will not be saved. Your program position stays where it is.</div>
    <button class="btn btn-danger" onclick="doAbandon()">Discard Workout</button>
    <button class="btn btn-ghost mt-8" onclick="closeModal()">Keep Training</button>
  `);
}
function doAbandon() {
  closeModal();
  saveActiveWorkout(null);
  activeWorkout = null;
  document.getElementById('workout-dot').classList.remove('show');
  renderWorkout();
}

// ═══════════════════════════════════════════════════════════════════
// EXERCISE SWAP
// ═══════════════════════════════════════════════════════════════════

function openSubPicker(ei) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[ei];
  const orig = ex.origName || ex.name;
  const opts = (SUBS[orig] || []).filter(o => o !== ex.name);

  const optsHtml = opts.map(o =>
    `<button class="sub-opt" data-n="${o}" onclick="applySub(${ei}, this.dataset.n)">${o}</button>`
  ).join('');

  openModal(`
    <div class="modal-title">Swap: ${ex.name}</div>
    <div class="modal-sub">Pick a substitute that hits the same movement pattern — machine down, joint pain, crowded gym, whatever the reason. Keep the prescribed ${ex.sets.length} sets × ${ex.repsLabel || ''} and choose a weight you can control with good form.</div>
    <label class="sub-remember"><input type="checkbox" id="sub-remember"> Use this swap in all future sessions</label>
    ${optsHtml || '<div class="modal-sub">No preset alternatives for this one — enter your own below.</div>'}
    <div style="display:flex;gap:8px;margin-top:8px">
      <input class="inp" id="sub-custom" placeholder="Or type your own…" style="margin-bottom:0;flex:1">
      <button class="btn btn-gold btn-sm" onclick="applyCustomSub(${ei})">Use</button>
    </div>
    ${ex.origName ? `<button class="btn btn-ghost mt-12" onclick="restoreSub(${ei})">Restore ${ex.origName}</button>` : ''}
    <button class="btn btn-ghost mt-8" onclick="closeModal()">Cancel</button>
  `);
}

function applySub(ei, newName) {
  if (!activeWorkout || !newName) return;
  const remember = document.getElementById('sub-remember')?.checked;
  const ex = activeWorkout.exercises[ei];
  const orig = ex.origName || ex.name;
  ex.origName = orig;
  ex.name = newName;
  // Pull in last logged weights for the substitute, if any
  const prev = getLastWeights(newName);
  ex.sets.forEach((s, i) => {
    if (!s.done) s.weight = prev ? (prev[i] ?? prev[0] ?? 0) : 0;
  });
  if (remember) {
    const st = getState();
    st.subs = st.subs || {};
    st.subs[orig] = newName;
    saveState(st);
  }
  saveActiveWorkout(activeWorkout);
  closeModal();
  renderWorkout();
  showToast(remember ? 'Swapped — will apply every session' : 'Swapped for this session');
}

function applyCustomSub(ei) {
  const v = document.getElementById('sub-custom').value.trim();
  if (!v) { showToast('Type an exercise name first'); return; }
  applySub(ei, v);
}

function restoreSub(ei) {
  if (!activeWorkout) return;
  const ex = activeWorkout.exercises[ei];
  const orig = ex.origName;
  if (!orig) { closeModal(); return; }
  ex.name = orig;
  delete ex.origName;
  const prev = getLastWeights(orig);
  ex.sets.forEach((s, i) => {
    if (!s.done) s.weight = prev ? (prev[i] ?? prev[0] ?? 0) : 0;
  });
  const st = getState();
  if (st.subs && st.subs[orig]) { delete st.subs[orig]; saveState(st); }
  saveActiveWorkout(activeWorkout);
  closeModal();
  renderWorkout();
  showToast('Original exercise restored');
}

// ═══════════════════════════════════════════════════════════════════
// REST TIMER
// ═══════════════════════════════════════════════════════════════════

let restInterval = null;
let restEndsAt = 0;

function startRestTimer(seconds, exerciseName, ei, si) {
  clearInterval(restInterval);
  const overlay = document.getElementById('rest-overlay');
  const exEl = document.getElementById('rest-exercise');

  // Find next set info
  const nextSi = si + 1;
  const ex = activeWorkout?.exercises[ei];
  let nextInfo = '';
  if (ex && nextSi < ex.sets.length) {
    nextInfo = `Next: Set ${nextSi + 1} of ${ex.name}`;
  } else if (ex) {
    const nextEi = activeWorkout.exercises.findIndex((e, i) => i > ei && !e.divider);
    if (nextEi >= 0) nextInfo = `Next exercise: ${activeWorkout.exercises[nextEi].name}`;
  }

  exEl.textContent = nextInfo;
  overlay.classList.add('show');

  // Count down from a wall-clock deadline so the timer stays correct
  // even while the screen is locked or the app is backgrounded.
  restEndsAt = Date.now() + seconds * 1000;
  updateRestDisplay();
  restInterval = setInterval(updateRestDisplay, 250);
}

function updateRestDisplay() {
  const remaining = Math.ceil((restEndsAt - Date.now()) / 1000);
  if (remaining <= 0) { skipRest(); return; }
  document.getElementById('rest-count').textContent = remaining;
}

function skipRest() {
  clearInterval(restInterval);
  document.getElementById('rest-overlay').classList.remove('show');
}

// Re-sync the countdown the moment the app returns to the foreground
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('rest-overlay').classList.contains('show')) {
    updateRestDisplay();
  }
});

// ═══════════════════════════════════════════════════════════════════
// HISTORY SCREEN
// ═══════════════════════════════════════════════════════════════════

function renderHistory() {
  const logs = getLogs();
  const sessions = Object.values(logs)
    .filter(l => l.date)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const state = getState();
  const unit = state?.unit || 'lbs';

  if (sessions.length === 0) {
    document.getElementById('history-content').innerHTML =
      `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div>No workouts logged yet.</div>
        <div class="text-sub mt-4">Complete your first session to see history here.</div>
      </div>`;
    return;
  }

  const html = sessions.map(log => {
    const exCount = (log.exercises || []).length;
    const setCount = (log.exercises || []).reduce((s, e) => s + (e.sets || []).filter(s => s.done).length, 0);
    const phase = PHASES.find(p => p.id === log.phaseId);
    const chipColor = phase?.color || '#666';
    return `<div class="hist-item" onclick="openHistDetail(${log.sessionIdx})">
      <div class="hi-left">
        <div class="hi-date">${formatDate(log.date)} · ${log.duration || '?'} min</div>
        <div class="hi-name">${log.dayLabel || 'Session'}</div>
        <div class="hi-detail">Ph${log.phaseId} Wk${log.phaseWeek} · ${setCount} sets completed</div>
      </div>
      <div class="hi-right">›</div>
    </div>`;
  }).join('');

  document.getElementById('history-content').innerHTML = html;
}

function openHistDetail(sessionIdx) {
  const logs = getLogs();
  const log = logs[sessionIdx];
  if (!log) return;

  const state = getState();
  const unit = state?.unit || 'lbs';

  document.getElementById('hdo-title').textContent = log.dayLabel || 'Session';
  document.getElementById('hdo-sub').textContent = `${formatDate(log.date)} · Phase ${log.phaseId} Wk${log.phaseWeek}`;

  const exHtml = (log.exercises || []).map(ex => {
    const setsHtml = (ex.sets || []).map((s, i) => {
      const val = ex.type === 'timed' || ex.type === 'dist'
        ? `${s.reps} ${ex.unit}`
        : `${s.weight} ${unit} × ${s.reps} reps`;
      return `<div class="text-sub" style="font-size:13px;padding:4px 0;border-top:1px solid var(--border)">
        Set ${i+1}: <span style="color:var(--text)">${val}</span>
        ${s.done ? '<span style="color:var(--green);margin-left:6px">✓</span>' : ''}
      </div>`;
    }).join('');

    return `<div class="card" style="margin-bottom:8px">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${ex.name}</div>
      ${setsHtml}
    </div>`;
  }).join('');

  document.getElementById('hdo-body').innerHTML = exHtml ||
    '<div class="text-sub">No exercise data recorded.</div>';

  document.getElementById('hist-detail-overlay').classList.add('show');
}

function closeHistDetail() {
  document.getElementById('hist-detail-overlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════════
// PROGRESS SCREEN
// ═══════════════════════════════════════════════════════════════════

const KEY_LIFTS = [
  'Squat', 'Deadlift', 'Bench Press', 'Overhead Press',
  'Weighted Pull-up', 'Power Cleans', 'Trap Bar Deadlift'
];

function renderProgress() {
  const state = getState();
  const unit = state?.unit || 'lbs';
  const logs = getLogs();

  // Bodyweight
  const bwHistory = logs._bodyweight || [];

  // Add bodyweight
  let bwHtml = '';
  if (bwHistory.length > 0) {
    const latest = bwHistory[bwHistory.length - 1];
    const first = bwHistory[0];
    const delta = latest.weight - first.weight;
    const sign = delta >= 0 ? '+' : '';
    bwHtml = `<div class="card mb-0">
      <div class="card-label">Bodyweight</div>
      <div class="flex justify-between items-center">
        <div>
          <span style="font-size:36px;font-weight:800;color:var(--gold)">${latest.weight}</span>
          <span class="text-sub" style="margin-left:4px">${unit}</span>
        </div>
        ${bwHistory.length > 1 ? `<div class="text-sub">${sign}${delta.toFixed(1)} ${unit} from start</div>` : ''}
      </div>
      <button class="btn btn-ghost btn-sm mt-8" onclick="logBodyweight()">Log Bodyweight</button>
    </div>`;
  } else {
    bwHtml = `<div class="card mb-0">
      <div class="card-label">Bodyweight</div>
      <div class="text-sub">Not tracked yet</div>
      <button class="btn btn-gold btn-sm mt-8" onclick="logBodyweight()">Log Bodyweight</button>
    </div>`;
  }

  // Key lifts
  let liftsHtml = '';
  const maxes = KEY_LIFTS.map(name => ({ name, ...getMaxWeight(name) }))
    .filter(l => l.max > 0);

  const maxWeight = maxes.reduce((m, l) => Math.max(m, l.max), 0);

  if (maxes.length === 0) {
    liftsHtml = `<div class="card"><div class="text-sub">No lifts logged yet. Complete a workout to see progress here.</div></div>`;
  } else {
    liftsHtml = maxes.map(l => {
      const barPct = maxWeight > 0 ? Math.round((l.max / maxWeight) * 100) : 0;
      return `<div class="lift-card">
        <div class="lift-name">${l.name}</div>
        <div class="flex items-center">
          <div>
            <span class="lift-max">${l.max}</span>
            <span class="lift-max-unit">${unit}</span>
          </div>
        </div>
        <div class="lift-bar-row">
          <div class="lift-bar-label">${l.max}${unit}</div>
          <div class="lift-bar-wrap"><div class="lift-bar-fill" style="width:${barPct}%"></div></div>
        </div>
        ${l.date ? `<div class="lift-recent">Last logged: ${formatDate(l.date)}</div>` : ''}
      </div>`;
    }).join('');
  }

  // Session streak / stats
  const completedSessions = Object.values(logs).filter(l => l.date).length;
  const nextSession = state.nextSession || 0;
  const totalSessions = SESSIONS.length;

  document.getElementById('progress-content').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="flex">
        <div style="flex:1;text-align:center">
          <div style="font-size:32px;font-weight:800;color:var(--gold)">${completedSessions}</div>
          <div class="text-sub" style="font-size:12px">Sessions done</div>
        </div>
        <div style="width:1px;background:var(--border);margin:0 8px"></div>
        <div style="flex:1;text-align:center">
          <div style="font-size:32px;font-weight:800;color:var(--blue)">${totalSessions - nextSession}</div>
          <div class="text-sub" style="font-size:12px">Remaining</div>
        </div>
        <div style="width:1px;background:var(--border);margin:0 8px"></div>
        <div style="flex:1;text-align:center">
          <div style="font-size:32px;font-weight:800;color:var(--green)">${TOTAL_WEEKS}</div>
          <div class="text-sub" style="font-size:12px">Total weeks</div>
        </div>
      </div>
    </div>

    <div style="margin-bottom:12px">${bwHtml}</div>

    <div class="card-label" style="padding:0 0 8px">Key Lifts — Best Logged Weight</div>
    ${liftsHtml}

    <div class="card mt-12" style="margin-bottom:0">
      <div class="card-label">Nutrition Targets</div>
      <div class="text-sub" style="line-height:1.7">
        🥩 Protein: 1g per lb bodyweight · 4–5 meals/day<br>
        🍚 Carbs: bulk pre/post workout<br>
        🥑 Fats: 0.4–0.5g per lb bodyweight<br>
        💊 Creatine 5g/day · D3 2000–4000 IU · Mag glycinate<br>
        💧 Min 1 oz water per lb bodyweight
      </div>
    </div>
  `;
}

function logBodyweight() {
  openModal(`
    <div class="modal-title">Log Bodyweight</div>
    <input class="inp" type="number" inputmode="decimal" step="0.1" id="bw-modal" placeholder="e.g. 187.5" style="margin-bottom:12px">
    <button class="btn btn-gold" onclick="saveBodyweight()">Save</button>
    <button class="btn btn-ghost mt-8" onclick="closeModal()">Cancel</button>
  `);
  setTimeout(() => document.getElementById('bw-modal')?.focus(), 60);
}
function saveBodyweight() {
  const val = parseFloat(document.getElementById('bw-modal').value);
  if (!val || isNaN(val)) { showToast('Enter a number'); return; }
  const logs = getLogs();
  if (!logs._bodyweight) logs._bodyweight = [];
  logs._bodyweight.push({ date: new Date().toISOString().slice(0,10), weight: val });
  saveLogs(logs);
  closeModal();
  renderProgress();
  showToast('Bodyweight logged');
}

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

function renderAll() {
  renderHome();
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════

function init() {
  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // Migrate an in-flight workout saved by the old version (sessionStorage)
  try {
    const legacy = sessionStorage.getItem('ng_active');
    if (legacy && !localStorage.getItem('ng_active')) localStorage.setItem('ng_active', legacy);
    sessionStorage.removeItem('ng_active');
  } catch {}

  const state = getState();

  if (!state || !state.initialized) {
    document.getElementById('setup-overlay').classList.remove('hidden');
    return;
  }

  document.getElementById('setup-overlay').classList.add('hidden');

  // Restore active workout indicator
  const active = getActiveWorkout();
  if (active) {
    activeWorkout = active;
    document.getElementById('workout-dot').classList.add('show');
  }

  renderHome();
}

init();
</script>
